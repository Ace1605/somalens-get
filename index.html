<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get SomaLens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(67, 142, 242, 0.12);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #010F2D;
      margin-bottom: 8px;
    }

    p {
      font-size: 15px;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }

    .btn:hover { opacity: 0.88; }

    .btn-ios {
      background: #010F2D;
      color: #fff;
    }

    .btn-android {
      background: #438EF2;
      color: #fff;
    }

    .btn svg {
      flex-shrink: 0;
    }

    .disclaimer {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logo placeholder — replace src with your actual logo URL -->
    <img
      class="logo"
      src="https://somalens.com/favicon.ico"
      alt="SomaLens"
      onerror="this.style.display='none'"
    />

    <h1>Get SomaLens</h1>
    <p>AI-powered wellness insights based on your self-reported symptoms. Available on iOS and Android.</p>

    <a
      class="btn btn-ios"
      href="https://apps.apple.com/ng/app/somalens/id6742758218"
      target="_blank"
      rel="noopener noreferrer">
      <!-- Apple icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      Download on the App Store
    </a>

    <a
      class="btn btn-android"
      href="https://play.google.com/store/apps/details?id=com.somalens"
      target="_blank"
      rel="noopener noreferrer">
      <!-- Play Store icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
        <path d="M3.18 23.76c.37.21.8.22 1.19.03l12.19-6.85-2.62-2.62-10.76 9.44zm-1.13-20.7A1.99 1.99 0 0 0 2 4.23v15.54c0 .65.34 1.22.86 1.54l.1.06 8.7-8.7v-.2L2.05 3.06zm17.09 8.37-2.5-1.4-2.9 2.9 2.9 2.9 2.52-1.41a2 2 0 0 0 0-2.99zM4.37.31a1.81 1.81 0 0 0-1.2.04l10.74 10.74 2.62-2.62L4.37.31z"/>
      </svg>
      Get it on Google Play
    </a>

    <p class="disclaimer">You'll be redirected to your device's app store.</p>
  </div>

  <script>
    // Auto-redirect based on device — fallback shows both buttons above
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(ua)) {
        window.location.href =
          'https://play.google.com/store/apps/details?id=com.somalens';
      } else if (/iPad|iPhone|iPod/i.test(ua) && !window.MSStream) {
        window.location.href =
          'https://apps.apple.com/ng/app/somalens/id6742758218';
      }
      // Desktop: show both buttons, no redirect
    })();
  </script>
</body>
</html>
